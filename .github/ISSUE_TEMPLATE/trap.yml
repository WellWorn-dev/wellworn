name: Report a trap
description: A library broke at a version and you know the fix. Fastest route is submit_trap from your agent; this form works too.
title: "trap: "
labels: [trap]
body:
  - type: input
    id: library
    attributes:
      label: Library and version range
      placeholder: better-auth >=1.7.0 <1.7.2
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: What you saw, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Fix
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Evidence URL
      description: Changelog, issue, or docs note that confirms it.
