name: Bug in the server, plugin, or a skill
description: Something in this repository misbehaves.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Client, version, the exact call, and the response.
    validations:
      required: true
